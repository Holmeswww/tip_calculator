<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tip & Split Calculator</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .calculator {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%;
      max-width: 420px;
      padding: 1.5rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input, select {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.65rem 0.85rem;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.15s ease;
    }

    input:focus, select:focus {
      border-color: var(--accent);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    .tip-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .tip-btn {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    .tip-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #0f172a;
    }

    .results {
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .summary-row.total {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text);
      margin-top: 0.5rem;
      padding-top: 0.5rem;
      border-top: 1px dashed var(--border);
    }

    .split-highlight {
      background: #0f172a;
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 0.85rem;
      margin-top: 1rem;
      text-align: center;
    }

    .split-highlight .amount {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--accent);
      margin-top: 0.2rem;
    }
  </style>
</head>
<body>

  <div class="calculator">
    <div class="form-group">
      <label for="bill">Bill Subtotal ($)</label>
      <input type="number" id="bill" placeholder="0.00" min="0" step="0.01" />
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label for="state">Location / State</label>
        <select id="state">
          <option value="0">Select state...</option>
          <option value="4.00">AL (4.00%)</option>
          <option value="0.00">AK (0.00%)</option>
          <option value="5.60">AZ (5.60%)</option>
          <option value="7.25" selected>CA (7.25%)</option>
          <option value="2.90">CO (2.90%)</option>
          <option value="6.35">CT (6.35%)</option>
          <option value="0.00">DE (0.00%)</option>
          <option value="6.00">FL (6.00%)</option>
          <option value="4.00">GA (4.00%)</option>
          <option value="4.00">HI (4.00%)</option>
          <option value="6.25">IL (6.25%)</option>
          <option value="6.00">MD (6.00%)</option>
          <option value="6.25">MA (6.25%)</option>
          <option value="6.00">MI (6.00%)</option>
          <option value="7.00">NJ (7.00%)</option>
          <option value="4.00">NY (4.00%)</option>
          <option value="0.00">OR (0.00%)</option>
          <option value="6.00">PA (6.00%)</option>
          <option value="6.25">TX (6.25%)</option>
          <option value="6.50">WA (6.50%)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="tax-rate">Tax Rate (%)</label>
        <input type="number" id="tax-rate" value="7.25" min="0" step="0.01" />
      </div>
    </div>

    <div class="form-group">
      <label>Tip Percentage</label>
      <div class="tip-buttons">
        <button type="button" class="tip-btn" data-percent="15">15%</button>
        <button type="button" class="tip-btn active" data-percent="18">18%</button>
        <button type="button" class="tip-btn" data-percent="20">20%</button>
        <button type="button" class="tip-btn" data-percent="custom">Custom</button>
      </div>
      <input type="number" id="custom-tip" placeholder="Custom Tip %" min="0" step="0.1" style="display: none;" />
    </div>

    <div class="form-group">
      <label for="split-count">Split Between (People)</label>
      <input type="number" id="split-count" value="1" min="1" step="1" />
    </div>

    <div class="results">
      <div class="summary-row">
        <span>Tax Amount:</span>
        <span id="tax-amount">$0.00</span>
      </div>
      <div class="summary-row">
        <span>Tip Amount:</span>
        <span id="tip-amount">$0.00</span>
      </div>
      <div class="summary-row total">
        <span>Grand Total:</span>
        <span id="total-amount">$0.00</span>
      </div>

      <div class="split-highlight">
        <span style="font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase;">Amount Per Person</span>
        <div class="amount" id="per-person">$0.00</div>
      </div>
    </div>
  </div>

  <script>
    const billInput = document.getElementById('bill');
    const stateSelect = document.getElementById('state');
    const taxRateInput = document.getElementById('tax-rate');
    const tipButtons = document.querySelectorAll('.tip-btn');
    const customTipInput = document.getElementById('custom-tip');
    const splitCountInput = document.getElementById('split-count');

    const taxAmountDisplay = document.getElementById('tax-amount');
    const tipAmountDisplay = document.getElementById('tip-amount');
    const totalAmountDisplay = document.getElementById('total-amount');
    const perPersonDisplay = document.getElementById('per-person');

    let currentTipPercent = 18;

    // Auto-update tax rate when selecting state
    stateSelect.addEventListener('change', () => {
      const selectedRate = stateSelect.value;
      taxRateInput.value = selectedRate;
      calculate();
    });

    // Preset / Custom tip button handlers
    tipButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        tipButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const value = btn.getAttribute('data-percent');
        if (value === 'custom') {
          customTipInput.style.display = 'block';
          currentTipPercent = parseFloat(customTipInput.value) || 0;
          customTipInput.focus();
        } else {
          customTipInput.style.display = 'none';
          currentTipPercent = parseFloat(value);
        }
        calculate();
      });
    });

    // Real-time recalculation triggers
    billInput.addEventListener('input', calculate);
    taxRateInput.addEventListener('input', calculate);
    customTipInput.addEventListener('input', () => {
      currentTipPercent = parseFloat(customTipInput.value) || 0;
      calculate();
    });
    splitCountInput.addEventListener('input', calculate);

    function calculate() {
      const bill = parseFloat(billInput.value) || 0;
      const taxRate = parseFloat(taxRateInput.value) || 0;
      const splitCount = Math.max(1, parseInt(splitCountInput.value, 10) || 1);

      const tax = bill * (taxRate / 100);
      const tip = bill * (currentTipPercent / 100);
      const total = bill + tax + tip;
      const perPerson = total / splitCount;

      taxAmountDisplay.textContent = `$${tax.toFixed(2)}`;
      tipAmountDisplay.textContent = `$${tip.toFixed(2)}`;
      totalAmountDisplay.textContent = `$${total.toFixed(2)}`;
      perPersonDisplay.textContent = `$${perPerson.toFixed(2)}`;
    }

    calculate();
  </script>
</body>
</html>
